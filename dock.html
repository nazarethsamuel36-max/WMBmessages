<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermon Presentation Dock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="presentation_frame.js"></script>
    <script src="text_measurer.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-base:     #0e0e0f;
            --bg-panel:    #141416;
            --bg-card:     #1c1c1f;
            --bg-hover:    #232327;
            --border:      #2a2a2e;
            --border-mid:  #3a3a3f;
            --gold:        #f5c842;
            --gold-dim:    #8a6e1a;
            --green:       #22c55e;
            --green-dim:   rgba(34,197,94,0.12);
            --green-glow:  rgba(34,197,94,0.3);
            --grey-sel:    rgba(255,255,255,0.06);
            --text-primary:#e8e8ea;
            --text-muted:  #6b6b72;
            --text-dim:    #9898a0;
            --slide-line:  #2e2e34;
            --radius:      8px;
            --radius-sm:   5px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        /* ====================================================
           TOP BAR
        ==================================================== */
        .top-bar {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .search-wrap {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 8px 12px 8px 32px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        #searchInput:focus { border-color: var(--gold); }
        #searchInput::placeholder { color: var(--text-muted); }

        /* ====================================================
           SEARCH RESULTS OVERLAY
        ==================================================== */
        .search-results-overlay {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            max-height: 400px;
            background: var(--bg-panel);
            border: 1px solid var(--border-mid);
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-results-overlay.active {
            display: block;
        }

        .search-result-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover, .search-result-item.selected {
            background: var(--bg-hover);
        }

        .result-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        .badge-message {
            background: rgba(245, 200, 66, 0.15);
            color: var(--gold);
        }

        .badge-paragraph {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
        }

        .badge-quote {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
        }

        .result-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .result-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .result-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .result-quote-snippet {
            font-family: 'Crimson Text', serif;
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.4;
            margin-top: 4px;
            font-style: italic;
            border-left: 2px solid var(--border-mid);
            padding-left: 8px;
        }

        .result-quote-snippet mark {
            background: rgba(245, 200, 66, 0.3);
            color: var(--gold);
            font-weight: 600;
            padding: 0 2px;
            border-radius: 2px;
        }

        .view-toggle {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .view-btn {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.03em;
        }

        .view-btn.active {
            background: var(--gold);
            color: #000;
        }

        /* ====================================================
           MAIN LAYOUT — 3 columns
        ==================================================== */
        .main-layout {
            display: grid;
            grid-template-columns: 180px 1fr 200px;
            overflow: hidden;
        }

        /* ====================================================
           LEFT — MESSAGE LIST
        ==================================================== */
        .message-panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel-label {
            padding: 10px 12px 6px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .message-item {
            padding: 9px 12px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.12s;
        }

        .message-item:hover {
            background: var(--bg-hover);
        }

        .message-item.active {
            border-left-color: var(--gold);
            background: var(--bg-hover);
        }

        .msg-date {
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 2px;
        }

        .msg-title {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
        }

        /* ====================================================
           CENTER — READING WORKSPACE
        ==================================================== */
        .workspace {
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-base);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 36px; opacity: 0.3; }
        .empty-state p { font-size: 13px; }

        /* Paragraph group */
        .para-group {
            margin-bottom: 20px;
        }

        /* Reading View Card */
        .para-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.15s;
        }

        .para-card.reading-pointer {
            border-color: var(--border-mid);
            box-shadow: 0 0 0 1px var(--border-mid);
        }

        .para-card.live-pointer {
            border-color: var(--green);
            box-shadow: 0 0 0 1px var(--green), 0 0 18px var(--green-glow);
        }

        .para-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .para-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .para-num {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.04em;
        }

        .para-state-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-mid);
            transition: background 0.2s;
        }

        .para-card.reading-pointer .para-state-dot { background: #555; }
        .para-card.live-pointer .para-state-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

        .para-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add-setlist {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--border-mid);
            background: none;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
        }

        .btn-add-setlist:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-play {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--border-mid);
            background: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
        }

        .btn-play:hover { border-color: var(--green); color: var(--green); }
        .para-card.live-pointer .btn-play { background: var(--green); color: #000; border-color: var(--green); }

        /* Paragraph full text */
        .para-text-full {
            padding: 10px 14px 12px;
            font-family: 'Crimson Text', serif;
            font-size: 15px;
            line-height: 1.65;
            color: #b0b0ba;
        }

        /* Slides within a paragraph */
        .slides-container {
            border-top: 1px solid var(--border);
        }

        .slide-card {
            padding: 10px 14px;
            border-bottom: 1px solid var(--slide-line);
            cursor: pointer;
            transition: background 0.12s;
            position: relative;
        }

        .slide-card:last-child { border-bottom: none; }

        .slide-card:hover { background: var(--bg-hover); }

        .slide-card.slide-reading {
            background: var(--grey-sel);
        }

        .slide-card.slide-live {
            background: var(--green-dim);
        }

        .slide-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }

        .slide-num-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
        }

        .slide-card.slide-live .slide-num-badge {
            background: var(--green);
            color: #000;
            border-color: var(--green);
        }

        .slide-text {
            font-family: 'Crimson Text', serif;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text-dim);
            white-space: pre-line;
        }

        .slide-card.slide-live .slide-text { color: #d4f7e4; }

        /* ====================================================
           LIST VIEW STYLES
        ==================================================== */
        .list-para-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.1s;
            border: 1px solid transparent;
            margin-bottom: 3px;
        }

        .list-para-row:hover { background: var(--bg-hover); }

        .list-para-row.reading-pointer {
            border-color: var(--border-mid);
            background: var(--grey-sel);
        }

        .list-para-row.live-pointer {
            border-color: var(--green);
            background: var(--green-dim);
            box-shadow: 0 0 10px var(--green-glow);
        }

        .list-chevron {
            font-size: 9px;
            color: var(--text-muted);
            transition: transform 0.15s;
        }

        .list-para-num { font-size: 12px; font-weight: 600; color: var(--gold); width: 30px; flex-shrink: 0; }
        .list-para-preview { font-size: 12px; color: var(--text-dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-slide-count { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
        .list-para-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-mid); flex-shrink: 0; }
        .list-para-row.live-pointer .list-para-dot { background: var(--green); }

        /* ====================================================
           RIGHT — SETLIST
        ==================================================== */
        .setlist-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .setlist-items {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .setlist-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.12s;
            position: relative;
        }

        .setlist-item:hover { border-color: var(--border-mid); }
        .setlist-item.sl-active { border-color: var(--gold); }

        .sl-msg { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .sl-para { font-size: 12px; color: var(--text-primary); font-weight: 500; }

        .sl-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .setlist-item:hover .sl-remove { opacity: 1; }
        .sl-remove:hover { color: #ef4444; }

        .setlist-empty {
            padding: 16px 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }

        /* ====================================================
           STATUS BAR
        ==================================================== */
        .status-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 14px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-left { display: flex; align-items: center; gap: 10px; }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: transparent;
            border: 1px solid var(--border-mid);
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .live-badge.live {
            background: var(--green-dim);
            border-color: var(--green);
            color: var(--green);
        }

        .live-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .live-badge.live .live-dot {
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* scrollbars */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-mid); }

        /* loading */
        .loading-msg {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchInput" placeholder="Search by title, date, or paragraph…">
            <div class="search-results-overlay" id="searchResultsOverlay"></div>
        </div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnRead" onclick="setView('read')">Read</button>
            <button class="view-btn" id="btnList" onclick="setView('list')">List</button>
        </div>
    </div>

    <!-- MAIN 3-PANEL LAYOUT -->
    <div class="main-layout">

        <!-- LEFT: Messages -->
        <div class="message-panel" id="messagePanel">
            <div class="panel-label">Messages</div>
            <div id="messageList">
                <div class="loading-msg">Loading…</div>
            </div>
        </div>

        <!-- CENTER: Reading Workspace -->
        <div class="workspace" id="workspace">
            <div class="empty-state" id="emptyState">
                <div class="icon">📖</div>
                <p>Select a message to begin reading</p>
            </div>
            <div id="paragraphContainer" style="display:none;"></div>
        </div>

        <!-- RIGHT: Setlist -->
        <div class="setlist-panel">
            <div class="panel-label">Setlist</div>
            <div class="setlist-items" id="setlistItems">
                <div class="setlist-empty">Add paragraphs<br>using the + button</div>
            </div>
        </div>

    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
        <div class="status-left">
            <div class="live-badge" id="liveBadge">
                <div class="live-dot"></div>
                <span id="liveLabel">READY</span>
            </div>
            <span id="statusText"></span>
        </div>
        <div id="slideInfo"></div>
    </div>

<script>
// ============================================================
// SUPABASE
// ============================================================
const SUPABASE_URL = 'https://qouzuypjuaytgusvrsoo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvdXp1eXBqdWF5dGd1c3Zyc29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MzQ4MzUsImV4cCI6MjEwMDIxMDgzNX0.idrjxDgA0FVpGfNq2HSb-mmHlpvDtKZ-cjj8bBnIK_U';

let supabaseClient = null;
try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) { console.warn('Supabase init failed', e); }

// ============================================================
// PRESENTATION SPEC (from shared module)
// ============================================================
const PRESENTATION_SPEC = window.PresentationFrame;

function wrapText(text, spec) {
    return window.TextMeasurer.wrapText(text, spec);
}

function createSlides(paragraph, spec) {
    const wrappedLines = wrapText(paragraph.text, spec);
    const linesPerSlide = spec.quote.maxVisibleLines;
    const slides = [];
    for (let i = 0; i < wrappedLines.length; i += linesPerSlide) {
        const slideLines = wrappedLines.slice(i, i + linesPerSlide);
        slides.push({
            slideNumber: Math.floor(i / linesPerSlide) + 1,
            totalSlides: Math.ceil(wrappedLines.length / linesPerSlide),
            lines: slideLines,
            quoteLines: slideLines,
            metadata: {
                book: paragraph.book,
                paragraph: paragraph.paragraph,
                title: paragraph.title,
                date: paragraph.date
            }
        });
    }
    return slides;
}

function parseSermonToSlides(sermonData) {
    const meta = { messageNumber: sermonData.messageNumber, title: sermonData.title, date: sermonData.date };
    return {
        metadata: meta,
        paragraphs: sermonData.paragraphs.map(p => ({
            paragraph: p.paragraph,
            text: p.text,
            slides: createSlides({ ...p, book: meta.messageNumber, title: meta.title, date: meta.date }, PRESENTATION_SPEC)
        }))
    };
}

// ============================================================
// APP STATE
// ============================================================
const state = {
    messages: [],
    currentMessageIndex: -1,
    presentationData: null,
    viewMode: 'read',   // 'read' | 'list'

    // Two independent pointers
    reading: { paragraphIndex: -1, slideIndex: 0 },
    live:    { messageIndex: -1, paragraphIndex: -1, slideIndex: 0 },
    isLive: false,

    setlist: []          // [{messageIndex, paragraphIndex, label}]
};

// DOM refs
const searchInput       = document.getElementById('searchInput');
const messageList       = document.getElementById('messageList');
const workspace         = document.getElementById('workspace');
const emptyState        = document.getElementById('emptyState');
const paragraphContainer= document.getElementById('paragraphContainer');
const setlistItems      = document.getElementById('setlistItems');
const liveBadge         = document.getElementById('liveBadge');
const liveLabel         = document.getElementById('liveLabel');
const statusText        = document.getElementById('statusText');
const slideInfo         = document.getElementById('slideInfo');

// ============================================================
// BROADCAST CHANNEL
// ============================================================
const presentationChannel = new BroadcastChannel('presentation_channel');

function sendToPresentation(action, data) {
    const cmd = { action, data };
    presentationChannel.postMessage(cmd);
    localStorage.setItem('presentationCommand', JSON.stringify(cmd));
}

// ============================================================
// VIEW MODE
// ============================================================
function setView(mode) {
    state.viewMode = mode;
    document.getElementById('btnRead').classList.toggle('active', mode === 'read');
    document.getElementById('btnList').classList.toggle('active', mode === 'list');
    renderWorkspace();
}

// ============================================================
// LOAD MESSAGES
// ============================================================
async function loadMessages() {
    try {
        if (supabaseClient) {
            // Supabase returns max 1000 rows per request — paginate to get ALL messages
            let allMessages = [];
            let from = 0;
            const pageSize = 1000;

            while (true) {
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('book_id, title, date')
                    .order('date', { ascending: true })
                    .range(from, from + pageSize - 1);

                if (error) throw error;
                if (!data || data.length === 0) break;

                allMessages = allMessages.concat(data);
                if (data.length < pageSize) break; // Last page
                from += pageSize;
            }

            if (allMessages.length > 0) {
                state.messages = allMessages.map(m => ({ id: m.book_id, title: m.title, date: m.date }));
                renderMessageList();
                return;
            }
        }
    } catch(e) { console.error('Supabase load error', e); }

    // Local fallback
    state.messages = [
        { file: 'sermon_47-0412.json',      title: 'Faith Is The Substance', date: '47-0412' },
        { file: 'sermon_65-0402M.json',     title: 'The Seed Shall Not Be Heir With the Shuck', date: '65-0402M' },
        { file: 'sermon_65-0410.json',       title: 'Leadership',             date: '65-0410' }
    ];
    renderMessageList();
}

function renderMessageList(filtered) {
    const list = filtered ?? state.messages;
    messageList.innerHTML = '';
    if (!list.length) {
        messageList.innerHTML = '<div class="loading-msg">No results</div>';
        return;
    }
    list.forEach(msg => {
        const realIndex = state.messages.indexOf(msg);
        const div = document.createElement('div');
        div.className = 'message-item' + (realIndex === state.currentMessageIndex ? ' active' : '');
        div.innerHTML = `<div class="msg-date">${msg.date}</div><div class="msg-title">${msg.title}</div>`;
        div.addEventListener('click', () => openMessage(realIndex));
        messageList.appendChild(div);
    });
}

// ============================================================
// OPEN MESSAGE (single click)
// ============================================================
async function openMessage(index, targetParagraphNo) {
    const isSameMessage = index === state.currentMessageIndex;
    
    if (!isSameMessage) {
        state.currentMessageIndex = index;
        renderMessageList();

        emptyState.style.display = 'none';
        paragraphContainer.style.display = 'block';
        paragraphContainer.innerHTML = '<div class="loading-msg">Loading message…</div>';

        const msg = state.messages[index];
        let sermonData;

        try {
            if (supabaseClient && msg.id) {
                const [{ data: mData, error: mErr }, { data: pData, error: pErr }] = await Promise.all([
                    supabaseClient.from('messages').select('book_id,title,date').eq('book_id', msg.id).single(),
                    supabaseClient.from('paragraphs').select('paragraph_no,text').eq('book_id', msg.id).order('paragraph_no', { ascending: true })
                ]);
                if (mErr) throw mErr;
                if (pErr) throw pErr;
                sermonData = { messageNumber: mData.date, title: mData.title, date: mData.date,
                    paragraphs: pData.map(p => ({ paragraph: p.paragraph_no, text: p.text })) };
            } else if (msg.file) {
                const res = await fetch(msg.file);
                sermonData = await res.json();
            } else throw new Error('No source');

            state.presentationData = parseSermonToSlides(sermonData);
            sendToPresentation('loadPresentation', state.presentationData);
        } catch(e) {
            console.error('Failed to load message', e);
            paragraphContainer.innerHTML = '<div class="loading-msg">Error loading message</div>';
            return;
        }
    }

    if (targetParagraphNo !== undefined) {
        const idx = state.presentationData?.paragraphs.findIndex(p => String(p.paragraph) === String(targetParagraphNo));
        if (idx !== undefined && idx >= 0) {
            state.reading.paragraphIndex = idx;
            state.reading.slideIndex = 0;
        }
    } else if (!isSameMessage) {
        state.reading = { paragraphIndex: 0, slideIndex: 0 };
    }

    renderWorkspace();
    updateStatus();
}

// ============================================================
// RENDER WORKSPACE
// ============================================================
function renderWorkspace() {
    if (!state.presentationData) return;
    paragraphContainer.innerHTML = '';

    const paras = state.presentationData.paragraphs;

    if (state.viewMode === 'read') {
        paras.forEach((para, pi) => renderReadCard(para, pi));
    } else {
        paras.forEach((para, pi) => renderListRow(para, pi));
    }

    // Scroll the reading pointer into view
    scrollToReading();
}

function renderReadCard(para, pi) {
    const isReading = pi === state.reading.paragraphIndex;
    const isLive    = state.isLive && pi === state.live.paragraphIndex;

    const group = document.createElement('div');
    group.className = 'para-group';
    group.id = `para-${pi}`;

    const card = document.createElement('div');
    card.className = 'para-card' + (isLive ? ' live-pointer' : isReading ? ' reading-pointer' : '');

    // Header
    const header = document.createElement('div');
    header.className = 'para-header';
    header.innerHTML = `
        <div class="para-label">
            <div class="para-state-dot"></div>
            <span class="para-num">¶ ${para.paragraph}</span>
        </div>
        <div class="para-actions">
            <button class="btn-add-setlist" title="Add to Setlist">+</button>
        </div>`;

    header.addEventListener('click', (e) => {
        if (e.target.closest('.btn-add-setlist')) { addToSetlist(pi); return; }
        // Clicking the paragraph header itself makes it go live
        toggleLive(pi);
    });

    card.appendChild(header);

    // Slides
    if (para.slides && para.slides.length) {
        const slidesWrap = document.createElement('div');
        slidesWrap.className = 'slides-container';

        para.slides.forEach((slide, si) => {
            const scard = document.createElement('div');
            const isSlideReading = isReading && si === state.reading.slideIndex;
            const isSlideL = isLive && si === state.live.slideIndex;
            scard.className = 'slide-card' + (isSlideL ? ' slide-live' : isSlideReading ? ' slide-reading' : '');
            scard.innerHTML = `
                <div class="slide-meta"><span class="slide-num-badge">Slide ${slide.slideNumber}</span></div>
                <div class="slide-text">${(slide.lines || slide.quoteLines || []).join('\n')}</div>`;
            scard.addEventListener('click', () => selectSlide(pi, si));
            slidesWrap.appendChild(scard);
        });

        card.appendChild(slidesWrap);
    }

    group.appendChild(card);
    paragraphContainer.appendChild(group);
}

function renderListRow(para, pi) {
    const isReading = pi === state.reading.paragraphIndex;
    const isLive    = state.isLive && pi === state.live.paragraphIndex;

    const row = document.createElement('div');
    row.className = 'list-para-row' + (isLive ? ' live-pointer' : isReading ? ' reading-pointer' : '');
    row.id = `para-${pi}`;

    const preview = (para.text || '').substring(0, 60) + '…';
    row.innerHTML = `
        <div class="list-para-dot"></div>
        <span class="list-para-num">${para.paragraph}</span>
        <span class="list-para-preview">${preview}</span>
        <span class="list-slide-count">${(para.slides||[]).length} sl</span>`;
    row.addEventListener('click', () => selectParagraph(pi));
    row.addEventListener('dblclick', () => selectAndToggleLive(pi));
    paragraphContainer.appendChild(row);
}

// ============================================================
// SELECTION LOGIC
// ============================================================
function selectParagraph(pi) {
    state.reading.paragraphIndex = pi;
    state.reading.slideIndex = 0;
    
    if (state.isLive) {
        state.live.messageIndex = state.currentMessageIndex;
        state.live.paragraphIndex = pi;
        state.live.slideIndex = 0;
        sendToPresentation('showSlide', {
            messageIndex: state.currentMessageIndex,
            paragraphIndex: pi,
            slideIndex: 0
        });
    }
    
    renderWorkspace();
    updateStatus();
    scrollToReading();
}

function selectSlide(pi, si) {
    state.reading.paragraphIndex = pi;
    state.reading.slideIndex = si;

    if (state.isLive) {
        state.live.messageIndex = state.currentMessageIndex;
        state.live.paragraphIndex = pi;
        state.live.slideIndex = si;
        sendToPresentation('showSlide', {
            messageIndex: state.currentMessageIndex,
            paragraphIndex: pi,
            slideIndex: si
        });
    }

    renderWorkspace();
    updateStatus();
    scrollToReading();
}

function selectAndToggleLive(pi) {
    state.reading.paragraphIndex = pi;
    state.reading.slideIndex = 0;
    toggleLive(pi);
}

function toggleLive(pi) {
    const targetPi = pi !== undefined ? pi : state.reading.paragraphIndex;
    if (targetPi < 0) return;

    const clickingSameParagraph = state.isLive && state.live.paragraphIndex === targetPi;

    if (clickingSameParagraph) {
        // Turn off
        state.isLive = false;
        liveBadge.classList.remove('live');
        liveLabel.textContent = 'READY';
        sendToPresentation('clearSlide');
    } else {
        // Turn on or transition to the new paragraph
        state.isLive = true;
        state.live = {
            messageIndex: state.currentMessageIndex,
            paragraphIndex: targetPi,
            slideIndex: state.reading.paragraphIndex === targetPi ? state.reading.slideIndex : 0
        };
        state.reading.paragraphIndex = targetPi;
        state.reading.slideIndex = state.live.slideIndex;
        liveBadge.classList.add('live');
        liveLabel.textContent = 'LIVE';
        sendToPresentation('showSlide', {
            messageIndex: state.live.messageIndex,
            paragraphIndex: state.live.paragraphIndex,
            slideIndex: state.live.slideIndex
        });
    }

    renderWorkspace();
    updateStatus();
    scrollToReading();
}

// ============================================================
// KEYBOARD NAVIGATION
// ============================================================
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    const paras = state.presentationData?.paragraphs || [];
    const pi = state.reading.paragraphIndex;
    const si = state.reading.slideIndex;

    switch(e.key) {
        case 'ArrowDown': // Next slide
            e.preventDefault();
            const slideCount = paras[pi]?.slides?.length || 1;
            if (si < slideCount - 1) {
                selectSlide(pi, si + 1);
            } else if (pi < paras.length - 1) {
                selectSlide(pi + 1, 0);
            }
            break;
        case 'ArrowUp': // Previous slide
            e.preventDefault();
            if (si > 0) {
                selectSlide(pi, si - 1);
            } else if (pi > 0) {
                const prevSlideCount = paras[pi - 1]?.slides?.length || 1;
                selectSlide(pi - 1, prevSlideCount - 1);
            }
            break;
        case 'ArrowRight': // Next paragraph
            e.preventDefault();
            if (pi < paras.length - 1) {
                selectParagraph(pi + 1);
            }
            break;
        case 'ArrowLeft': // Previous paragraph
            e.preventDefault();
            if (pi > 0) {
                selectParagraph(pi - 1);
            }
            break;
        case 'Enter': // Toggle Live active/inactive state
            e.preventDefault();
            toggleLive();
            break;
    }
});

// ============================================================
// SCROLL READING POINTER INTO VIEW
// ============================================================
function scrollToReading() {
    const pi = state.reading.paragraphIndex;
    if (pi < 0) return;
    requestAnimationFrame(() => {
        const el = document.getElementById(`para-${pi}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
}

// ============================================================
// STATUS BAR
// ============================================================
function updateStatus() {
    const pi = state.reading.paragraphIndex;
    const si = state.reading.slideIndex;
    const msg = state.messages[state.currentMessageIndex];

    if (pi >= 0 && state.presentationData) {
        const para = state.presentationData.paragraphs[pi];
        const slideCount = para?.slides?.length || 1;
        statusText.textContent = msg ? `${msg.date} · ¶${para.paragraph}` : `¶${para.paragraph}`;
        slideInfo.textContent = `Slide ${si + 1} / ${slideCount}`;
    } else {
        statusText.textContent = '';
        slideInfo.textContent = '';
    }
}

// ============================================================
// SETLIST
// ============================================================
function addToSetlist(pi) {
    const para = state.presentationData?.paragraphs[pi];
    const msg  = state.messages[state.currentMessageIndex];
    if (!para || !msg) return;

    const entry = {
        messageIndex: state.currentMessageIndex,
        paragraphIndex: pi,
        msgDate: msg.date,
        paraNum: para.paragraph
    };

    // Avoid duplicates
    const dup = state.setlist.find(s => s.messageIndex === entry.messageIndex && s.paragraphIndex === entry.paragraphIndex);
    if (dup) return;

    state.setlist.push(entry);
    renderSetlist();
}

function removeFromSetlist(i) {
    state.setlist.splice(i, 1);
    renderSetlist();
}

function renderSetlist() {
    setlistItems.innerHTML = '';
    if (!state.setlist.length) {
        setlistItems.innerHTML = '<div class="setlist-empty">Add paragraphs<br>using the + button</div>';
        return;
    }
    state.setlist.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'setlist-item';
        div.innerHTML = `
            <div class="sl-msg">${s.msgDate}</div>
            <div class="sl-para">¶ ${s.paraNum}</div>
            <button class="sl-remove" title="Remove">✕</button>`;
        div.querySelector('.sl-remove').addEventListener('click', (e) => {
            e.stopPropagation();
            removeFromSetlist(i);
        });
        div.addEventListener('click', async () => {
            await openMessage(s.messageIndex);
            state.reading.paragraphIndex = s.paragraphIndex;
            state.reading.slideIndex = 0;
            renderWorkspace();
            scrollToReading();
        });
        setlistItems.appendChild(div);
    });
}

// ============================================================
// INTENT SEARCH ENGINE
// ============================================================
class SearchIntentRouter {
    constructor() {
        this.handlers = [];
    }

    registerHandler(handler) {
        this.handlers.push(handler);
    }

    async search(query) {
        const results = [];
        for (const handler of this.handlers) {
            try {
                if (handler.matches(query)) {
                    const res = await handler.execute(query);
                    results.push(...res);
                }
            } catch(e) {
                console.error("Search handler error:", e);
            }
        }
        return results;
    }
}

// Handler: Jump directly to paragraph if book is open and query is a number
class ParagraphNavigationHandler {
    matches(query) {
        return state.presentationData !== null && /^\d+$/.test(query);
    }
    execute(query) {
        const num = parseInt(query, 10);
        const paras = state.presentationData.paragraphs;
        const idx = paras.findIndex(p => String(p.paragraph) === String(num));
        if (idx >= 0) {
            return [{
                type: 'paragraph',
                badge: '📍 Paragraph',
                title: `Paragraph ${num}`,
                subtitle: state.messages[state.currentMessageIndex].title,
                messageIndex: state.currentMessageIndex,
                paragraphNo: num
            }];
        }
        return [];
    }
}

// Handler: Combined message date + paragraph number (e.g. "65-0410 20")
class CombinedDateParagraphHandler {
    matches(query) {
        return /^(\d{2}-?\d{0,5}[A-Z]?)\s+(\d+)$/i.test(query);
    }
    execute(query) {
        const match = query.match(/^(\d{2}-?\d{0,5}[A-Z]?)\s+(\d+)$/i);
        if (!match) return [];
        const datePart = match[1].toLowerCase();
        const paraNum = parseInt(match[2], 10);

        const mIdx = state.messages.findIndex(m => m.date.toLowerCase().includes(datePart));
        if (mIdx >= 0) {
            return [{
                type: 'paragraph',
                badge: '📍 Paragraph',
                title: `Paragraph ${paraNum}`,
                subtitle: state.messages[mIdx].title + ` (${state.messages[mIdx].date})`,
                messageIndex: mIdx,
                paragraphNo: paraNum
            }];
        }
        return [];
    }
}

// Handler: Search sermon dates
class DateSearchHandler {
    matches(query) {
        return /^\d{2}-?\d{0,5}[A-Z]?$/.test(query);
    }
    execute(query) {
        const q = query.toLowerCase();
        return state.messages
            .filter(m => m.date.toLowerCase().includes(q))
            .map(m => ({
                type: 'message',
                badge: '📖 Message',
                title: m.title,
                subtitle: m.date,
                messageIndex: state.messages.indexOf(m),
                paragraphNo: undefined
            }));
    }
}

// Handler: Search sermon titles
class TitleSearchHandler {
    matches(query) {
        return query.length >= 2 && !/^\d+$/.test(query) && !/^\d{2}-?/.test(query);
    }
    execute(query) {
        const q = query.toLowerCase();
        return state.messages
            .filter(m => m.title.toLowerCase().includes(q))
            .map(m => ({
                type: 'message',
                badge: '📖 Message',
                title: m.title,
                subtitle: m.date,
                messageIndex: state.messages.indexOf(m),
                paragraphNo: undefined
            }));
    }
}

// Handler: Search quotes inside paragraph text
class QuoteSearchHandler {
    matches(query) {
        return query.length >= 3 && !/^\d+$/.test(query) && !/^\d{2}-?/.test(query);
    }
    async execute(query) {
        const q = query.toLowerCase();
        const results = [];

        // Search local cache first
        const localMatches = localParagraphsCache.filter(p => p.text.toLowerCase().includes(q));
        localMatches.forEach(p => {
            const mIdx = state.messages.findIndex(m => m.file === p.book_id || m.id === p.book_id);
            if (mIdx >= 0) {
                results.push({
                    type: 'quote',
                    badge: '💬 Quote',
                    title: p.title,
                    subtitle: `${p.date} · Paragraph ${p.paragraph_no}`,
                    text: p.text,
                    messageIndex: mIdx,
                    paragraphNo: p.paragraph_no
                });
            }
        });

        // Search Supabase paragraphs table if connected
        if (supabaseClient) {
            try {
                const { data, error } = await supabaseClient
                    .from('paragraphs')
                    .select('book_id, paragraph_no, text, messages(title, date)')
                    .ilike('text', `%${query}%`)
                    .limit(15);
                
                if (data) {
                    data.forEach(p => {
                        const mIdx = state.messages.findIndex(m => m.id === p.book_id);
                        if (mIdx >= 0) {
                            if (!results.some(r => r.messageIndex === mIdx && String(r.paragraphNo) === String(p.paragraph_no))) {
                                results.push({
                                    type: 'quote',
                                    badge: '💬 Quote',
                                    title: p.messages?.title || 'Sermon',
                                    subtitle: `${p.messages?.date || ''} · Paragraph ${p.paragraph_no}`,
                                    text: p.text,
                                    messageIndex: mIdx,
                                    paragraphNo: p.paragraph_no
                                });
                            }
                        }
                    });
                }
            } catch(e) { console.error("Supabase quote search error", e); }
        }

        return results;
    }
}

// Global Intent Search instances & state
const searchRouter = new SearchIntentRouter();
searchRouter.registerHandler(new ParagraphNavigationHandler());
searchRouter.registerHandler(new CombinedDateParagraphHandler());
searchRouter.registerHandler(new DateSearchHandler());
searchRouter.registerHandler(new TitleSearchHandler());
searchRouter.registerHandler(new QuoteSearchHandler());

let localParagraphsCache = [];
state.searchSelectedIndex = -1;

async function preloadLocalParagraphs() {
    for (const msg of state.messages) {
        if (msg.file) {
            try {
                const res = await fetch(msg.file);
                const data = await res.json();
                data.paragraphs.forEach(p => {
                    localParagraphsCache.push({
                        book_id: msg.file,
                        title: data.title,
                        date: data.date,
                        paragraph_no: p.paragraph,
                        text: p.text
                    });
                });
            } catch(e) { console.error("Error preloading local file", msg.file, e); }
        }
    }
}

// Search Results DOM interactions
const overlay = document.getElementById('searchResultsOverlay');

function hideSearchResults() {
    overlay.classList.remove('active');
    overlay.innerHTML = '';
    state.searchSelectedIndex = -1;
}

function selectSearchResult(res) {
    if (res.type === 'message') {
        openMessage(res.messageIndex).then(() => {
            searchInput.value = res.subtitle + ' ';
            searchInput.focus();
            
            // Dispatch input event to immediately display the updated search results (e.g. for typing paragraph number next)
            const event = new Event('input', { bubbles: true });
            searchInput.dispatchEvent(event);
        });
    } else {
        openMessage(res.messageIndex, res.paragraphNo).then(() => {
            searchInput.value = '';
            hideSearchResults();
        });
    }
}

function updateSelectedSearchResult(items) {
    items.forEach((item, idx) => {
        item.classList.toggle('selected', idx === state.searchSelectedIndex);
        if (idx === state.searchSelectedIndex) {
            item.scrollIntoView({ block: 'nearest' });
        }
    });
}

// Search Listeners
let searchTimeout = null;
searchInput.addEventListener('input', e => {
    let query = e.target.value.trim();

    // Auto-insert hyphen after year if missing (e.g. 650402 -> 65-0402)
    if (/^\d{3,}/.test(query) && !query.includes('-')) {
        query = query.slice(0, 2) + '-' + query.slice(2);
        e.target.value = query;
    }

    clearTimeout(searchTimeout);
    if (!query) {
        hideSearchResults();
        return;
    }

    searchTimeout = setTimeout(async () => {
        const results = await searchRouter.search(query);
        renderSearchResults(results, query);
    }, 150);
});

searchInput.addEventListener('keydown', e => {
    const items = overlay.querySelectorAll('.search-result-item');
    if (!items.length || !overlay.classList.contains('active')) return;

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.searchSelectedIndex = (state.searchSelectedIndex + 1) % items.length;
        updateSelectedSearchResult(items);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.searchSelectedIndex = (state.searchSelectedIndex - 1 + items.length) % items.length;
        updateSelectedSearchResult(items);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (state.searchSelectedIndex >= 0) {
            items[state.searchSelectedIndex].click();
        }
    } else if (e.key === 'Escape') {
        e.preventDefault();
        hideSearchResults();
    }
});

function renderSearchResults(results, query) {
    overlay.innerHTML = '';
    state.searchSelectedIndex = -1;

    if (!results.length) {
        overlay.innerHTML = '<div class="loading-msg">No results found</div>';
        overlay.classList.add('active');
        return;
    }

    results.forEach((res, idx) => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        
        let badgeClass = 'badge-quote';
        if (res.type === 'message') badgeClass = 'badge-message';
        else if (res.type === 'paragraph') badgeClass = 'badge-paragraph';

        let inner = `
            <div class="result-meta">
                <div>
                    <span class="result-badge ${badgeClass}">${res.badge}</span>
                    <span class="result-title">${res.title}</span>
                </div>
                <span class="result-subtitle">${res.subtitle || ''}</span>
            </div>
        `;

        if (res.type === 'quote' && res.text) {
            const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            const snippet = res.text.replace(regex, '<mark>$1</mark>');
            inner += `<div class="result-quote-snippet">"${snippet}"</div>`;
        }

        div.innerHTML = inner;
        div.addEventListener('click', () => selectSearchResult(res));
        overlay.appendChild(div);
    });

    overlay.classList.add('active');
}

// Hide search dropdown when clicking outside
document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) {
        hideSearchResults();
    }
});

// ============================================================
// INIT
// ============================================================
loadMessages().then(() => {
    preloadLocalParagraphs();
});
</script>
